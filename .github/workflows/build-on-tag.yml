name: build-on-tag

# Thin admin-only entry: rebuilds the artifact of one v* tag.
#
# It owns no logic. The automatic build is ci-dispatch.yml's tag trigger
# (every v* tag push); this file calls that same workflow with
# trigger=tag and the tag as ref, which runs ci/audits/tag/
# required.build.sh -> scripts/workflows/build-retry.sh (retry plus
# BUILD_IDEMPOTENCY_CHECK probe), the release artifact audit and the
# release test. No event trigger, so a tag push never builds twice.
#
#   gh workflow run build-on-tag.yml -f tag=v2026.0.7
#
# Off-grid twin: .io.v4rian.neo-git/bin/ci-local --workflow build-on-tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'v* tag to build.'
        required: true

# Permissions: exactly ci-dispatch.yml's set. GitHub never elevates
# permissions down a call chain, so the caller must grant what the called
# workflow requests; the admin gate and ci-dispatch's ref validator are
# what keep this token away from untrusted code. The set sits at workflow
# level, which GitHub applies to every job including the calling one (its
# docs give a called workflow the default token only when the calling job
# has no permissions at all).
permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  issues: write
  id-token: write
  actions: read

jobs:
  admin:
    name: verify actor is repo admin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: verify actor is repo admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: bash .io.v4rian.neo-git/scripts/workflows/verify-actor-admin.sh

  build:
    needs: admin
    uses: ./.github/workflows/ci-dispatch.yml
    with:
      trigger: tag
      ref: ${{ inputs.tag }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
